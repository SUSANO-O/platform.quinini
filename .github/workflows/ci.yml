name: CI

# En push llega DESPUÉS del push: sirve para enterarse rápido, no para frenar.
# Ojo: el deploy (Vercel + Cloud Build) se dispara con el mismo push y NO
# espera a esto. Para gatear de verdad hay que trabajar por PR con branch
# protection.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests + typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Este sí frena: 695 tests verdes hoy.
      - name: Tests
        run: npm test

      # Bloquea: los 8 errores preexistentes en src/lib/__tests__/ se bajaron a
      # cero (2026-09-03). Que frene es lo que evita que se acumulen otra vez.
      - name: Typecheck
        run: npm run typecheck
