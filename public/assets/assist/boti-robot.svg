<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Boti, asistente de BotIvA">
  <defs>
    <radialGradient id="shell" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#a9cad3"/>
      <stop offset="0.45" stop-color="#6e98a5"/>
      <stop offset="1" stop-color="#3b6370"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="25%" r="85%">
      <stop offset="0" stop-color="#9fc2cc"/>
      <stop offset="0.5" stop-color="#628d9a"/>
      <stop offset="1" stop-color="#355b67"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3138"/>
      <stop offset="1" stop-color="#070d10"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e9feff"/>
      <stop offset="0.35" stop-color="#7cf3ff"/>
      <stop offset="1" stop-color="#19c2e6"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#b9d7df"/>
      <stop offset="1" stop-color="#43707d"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b2a33" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b2a33" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- sombra en el suelo: flota -->
  <ellipse cx="128" cy="236" rx="58" ry="9" fill="url(#shadow)"/>

  <!-- antena -->
  <rect x="124.5" y="20" width="7" height="30" rx="3.5" fill="#4f7a87"/>
  <circle cx="128" cy="20" r="11" fill="url(#ball)"/>
  <ellipse cx="124" cy="15.5" rx="4" ry="2.6" fill="#fff" opacity="0.55"/>

  <!-- cuerpo -->
  <path d="M86 168 C86 150 104 142 128 142 C152 142 170 150 170 168 L166 196 C163 214 148 222 128 222 C108 222 93 214 90 196 Z" fill="url(#body)"/>
  <ellipse cx="112" cy="158" rx="16" ry="6" fill="#fff" opacity="0.22" filter="url(#soft)"/>
  <!-- brazos -->
  <path d="M84 166 C70 170 62 186 66 200 C69 209 80 207 84 198 C88 189 92 178 90 170 Z" fill="url(#body)"/>
  <path d="M172 166 C188 166 204 172 210 182 C214 190 206 196 196 192 C186 188 176 182 170 176 Z" fill="url(#body)"/>

  <!-- cabeza -->
  <path d="M52 92 C52 60 84 44 128 44 C172 44 204 60 204 92 C204 128 176 144 128 144 C80 144 52 128 52 92 Z" fill="url(#shell)"/>
  <ellipse cx="96" cy="64" rx="26" ry="9" fill="#fff" opacity="0.35" filter="url(#soft)" transform="rotate(-12 96 64)"/>

  <!-- visor -->
  <path d="M70 94 C70 74 94 66 128 66 C162 66 186 74 186 94 C186 116 164 126 128 126 C92 126 70 116 70 94 Z" fill="url(#visor)"/>
  <path d="M82 80 C92 72 112 70 128 70 C112 74 96 78 86 88 Z" fill="#fff" opacity="0.14"/>

  <!-- ojos -->
  <g filter="url(#glow)">
    <ellipse cx="104" cy="96" rx="14" ry="15" fill="url(#eye)"/>
    <ellipse cx="152" cy="96" rx="14" ry="15" fill="url(#eye)"/>
  </g>
  <ellipse cx="100" cy="90" rx="4" ry="3" fill="#fff" opacity="0.8"/>
  <ellipse cx="148" cy="90" rx="4" ry="3" fill="#fff" opacity="0.8"/>
</svg>
