# Pipeline de deploy de platform-quinini — la landing pública + dashboard de agentes.
#
# Esta es la definición REAL del pipeline: el trigger de Cloud Build de este
# repo apunta a este archivo. Antes los pasos vivían inline dentro del trigger,
# sin historial ni review; se migraron acá para que el pipeline cambie junto
# con el código y se pueda revertir con git.
#
# Se dispara solo en push a `main` — o sea, un merge acá va a producción.

substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_PROJECT_ID: matias-agents
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: europe-west1
  _PLATFORM: managed
  _SERVICE_NAME: platform-quinini

options:
  logging: CLOUD_LOGGING_ONLY
  # ALLOW_LOOSE: `_TRIGGER_ID` solo lo define el trigger, y `$BUILD_ID` /
  # `$COMMIT_SHA` / `$REPO_NAME` solo se auto-llenan en builds disparados por
  # git. Sin esto, un build manual falla por substitutions sin resolver.
  substitutionOption: ALLOW_LOOSE

timeout: 1200s

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - platform-quinini

steps:
  # Gate: si los tests fallan, el build corta acá y NO se deploya.
  # node:24 trae npm 11, el mismo que el Dockerfile y CI — ver
  # docs/RUNTIME-UPGRADES.md sobre por qué las tres tienen que coincidir
  # el package-lock.json tiene que generarse con esa misma major.
  - id: Test
    name: node:24
    entrypoint: bash
    args:
      - -c
      - npm ci && npm test

  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  # `services update` (no `deploy`): cambia solo la imagen y conserva la
  # config del servicio — env vars, escalado, secretos. Por eso los flags de
  # `--max-instances` o `--set-env-vars` NO van acá: viven en el servicio.
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --platform=managed
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - --region=$_DEPLOY_REGION
      - --quiet

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
