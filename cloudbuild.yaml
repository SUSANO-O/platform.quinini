# Build + deploy del landing (Next.js) a Cloud Run.
# Uso:
#   gcloud builds submit --config=cloudbuild.yaml . \
#     --substitutions=_REGION=europe-west1,_SERVICE_NAME=platform-quinini,\
# _TURNSTILE_SITE_KEY=0x4AAAAAADXYb8JlopS9-PpD,_APP_URL=https://www.quinini.online,\
# _AGENTFLOW_API_URL=https://CHANGE-ME-agent-flow-api.run.app
#
# IMPORTANTE: las NEXT_PUBLIC_* se hornean en el bundle del cliente EN BUILD, por eso
# se pasan como --build-arg (no como env de runtime). No son secretos: viajan al navegador.
# El paso de deploy NO define --set-env-vars ni --set-secrets, así conserva la
# configuración de runtime (MONGODB_URI, JWT_SECRET, TURNSTILE_SECRET_KEY, etc.) que
# ya tenga el servicio en Cloud Run.

substitutions:
  _SERVICE_NAME: platform-quinini
  _REGION: europe-west1
  _AR_REPO: aihub
  _TURNSTILE_SITE_KEY: ''          # site key público de Turnstile (debe casar con TURNSTILE_SECRET_KEY del runtime)
  _APP_URL: https://www.quinini.online
  _AGENTFLOW_API_URL: ''           # URL pública de agent-flow-api en prod
  _AGENTFLOWHUB_URL: ''            # URL pública de AgentFlowhub en prod
  _ASSIST_SCRIPT_URL: ''
  _SENTRY_DSN: ''
  _STRIPE_PUBLISHABLE_KEY: ''

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
      - --build-arg
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_TURNSTILE_SITE_KEY}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_AGENTFLOW_API_URL=${_AGENTFLOW_API_URL}
      - --build-arg
      - NEXT_PUBLIC_AGENTFLOWHUB_URL=${_AGENTFLOWHUB_URL}
      - --build-arg
      - NEXT_PUBLIC_ASSIST_SCRIPT_URL=${_ASSIST_SCRIPT_URL}
      - --build-arg
      - NEXT_PUBLIC_SENTRY_DSN=${_SENTRY_DSN}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_STRIPE_PUBLISHABLE_KEY}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=3201
      - --allow-unauthenticated
      - --ingress=all
      # Conserva env vars y secrets de runtime ya configurados en el servicio.

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
